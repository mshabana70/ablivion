[project]
name = "abl-experiments"
version = "0.1.0"
description = "RQ1 and RQ2 research experiments: preregistrations, probes, detectors, analyses."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "innards",
]

[project.scripts]
abx = "abl_experiments.cli:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10"]
build-backend = "uv_build"
